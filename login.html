<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>N10 SERVER MENA - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #123b70 0%,
          #071525 45%,
          #03070d 100%
        );
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(8, 20, 36, 0.95);
      border: 1px solid #168cff;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 0 35px rgba(0, 140, 255, 0.25);
      text-align: center;
    }

    .logo {
      width: 95px;
      height: 95px;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, #168cff, #0051a8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(22, 140, 255, 0.45);
    }

    h1 {
      color: #42a5ff;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a9c9e8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 20px;
      text-align: right;
    }

    .card h2 {
      color: #42a5ff;
      text-align: center;
      margin-bottom: 8px;
    }

    .description {
      color: #c8d9e8;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #a9c9e8;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #168cff;
      border-radius: 12px;
      background: #071525;
      color: white;
      outline: none;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #42a5ff;
      box-shadow: 0 0 12px rgba(22, 140, 255, 0.3);
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 14px;
      background: #168cff;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: #087de8;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #5cff8a;
    }

    .error {
      color: #ff5555;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      color: #a9c9e8;
      font-size: 13px;
    }

    .links a {
      color: #42a5ff;
      text-decoration: none;
      font-weight: bold;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      N10
    </div>

    <h1>
      N10 SERVER MENA
    </h1>

    <p class="subtitle">
      تسجيل الدخول إلى حسابك
    </p>

    <div class="card">

      <h2>
        🔐 تسجيل الدخول
      </h2>

      <p class="description">
        أدخل اسم المستخدم وكلمة المرور للدخول إلى حسابك.
      </p>

      <form id="loginForm">

        <div class="form-group">

          <label for="username">
            اسم المستخدم
          </label>

          <input
            id="username"
            name="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
            minlength="3"
            maxlength="24"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            كلمة المرور
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            minlength="6"
            required
          >

        </div>

        <button
          id="loginButton"
          class="btn"
          type="submit"
        >
          LOGIN
        </button>

        <p id="message"></p>

      </form>

      <div class="links">

        ما عندكش حساب؟

        <a href="./index.html">
          إنشاء حساب
        </a>

      </div>

    </div>

  </div>

  <script>
    "use strict";

    /* =====================================================
       N10 SERVER MENA
       LOGIN
    ===================================================== */

    const API_URL =
      "https://n10-discord-backend-new.onrender.com";

    /* =====================================================
       STORAGE
    ===================================================== */

    const STORAGE = {
      token: "n10SessionToken",
      username: "n10Username",
      accessKey: "n10AccessKey",
      user: "n10User"
    };

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");

    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    /* =====================================================
       HELPERS
    ===================================================== */

    function showError(text) {
      message.className = "error";
      message.textContent =
        text || "حدث خطأ.";
    }

    function showSuccess(text) {
      message.className = "success";
      message.textContent =
        text || "تم تسجيل الدخول بنجاح.";
    }

    function setLoading(loading) {

      loginButton.disabled =
        loading;

      loginButton.classList.toggle(
        "loading",
        loading
      );

      loginButton.textContent =
        loading
          ? "جاري الدخول..."
          : "LOGIN";
    }

    function isValidAccessKey(key) {

      if (
        typeof key !== "string"
      ) {
        return false;
      }

      return /^N10-[A-Za-z0-9]+$/.test(
        key.trim()
      );
    }

    /* =====================================================
       LOGIN
    ===================================================== */

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const username =
          usernameInput.value.trim();

        const password =
          passwordInput.value;

        /* ================= VALIDATION ================= */

        if (!username) {

          showError(
            "الرجاء إدخال اسم المستخدم."
          );

          usernameInput.focus();

          return;
        }

        if (!password) {

          showError(
            "الرجاء إدخال كلمة المرور."
          );

          passwordInput.focus();

          return;
        }

        if (
          username.length < 3 ||
          username.length > 24
        ) {

          showError(
            "اسم المستخدم غير صالح."
          );

          return;
        }

        /* ================= LOADING ================= */

        message.className = "";

        message.textContent =
          "جاري الاتصال بالسيرفر...";

        setLoading(true);

        try {

          /* ================= REQUEST ================= */

          const response =
            await fetch(
              `${API_URL}/api/login`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Accept":
                    "application/json"
                },

                credentials: "include",

                body:
                  JSON.stringify({
                    username,
                    password
                  })
              }
            );

          /* ================= RESPONSE ================= */

          let data = {};

          const contentType =
            response.headers.get(
              "content-type"
            ) || "";

          if (
            contentType.includes(
              "application/json"
            )
          ) {

            try {

              data =
                await response.json();

            } catch {

              data = {};

            }

          } else {

            const text =
              await response.text();

            data = {
              message: text
            };

          }

          /* ================= ERROR ================= */

          if (!response.ok) {

            throw new Error(
              data.message ||
              data.error ||
              `فشل تسجيل الدخول. HTTP ${response.status}`
            );

          }

          if (
            data.success === false
          ) {

            throw new Error(
              data.message ||
              "اسم المستخدم أو كلمة المرور غير صحيحة."
            );

          }

          /* ================= TOKEN ================= */

          const sessionToken =
            data.sessionToken ||
            data.token ||
            data.accessToken ||
            null;

          if (sessionToken) {

            localStorage.setItem(
              STORAGE.token,
              String(sessionToken)
            );

          }

          /* ================= USER ================= */

          const user =
            data.user ||
            null;

          if (user) {

            localStorage.setItem(
              STORAGE.user,
              JSON.stringify(user)
            );

            if (
              user.username
            ) {

              localStorage.setItem(
                STORAGE.username,
                String(user.username)
              );

            }

          } else {

            localStorage.setItem(
              STORAGE.username,
              username
            );

          }

          /* ================= ACCESS KEY ================= */

          const accessKey =
            data.accessKey ||
            data.access_key ||
            (
              user &&
              (
                user.accessKey ||
                user.access_key
              )
            ) ||
            null;

          if (
            accessKey &&
            isValidAccessKey(accessKey)
          ) {

            localStorage.setItem(
              STORAGE.accessKey,
              accessKey.trim()
            );

          }

          /* ================= SUCCESS ================= */

          showSuccess(
            "✅ تم تسجيل الدخول بنجاح!"
          );

          /*
             إذا السيرفر أعطانا Session Token
             أو Access Key، ننتقل إلى الصفحة الرئيسية.
          */

          setTimeout(
            function () {

              window.location.href =
                "./index.html";

            },
            600
          );

        } catch (error) {

          console.error(
            "N10 LOGIN ERROR:",
            error
          );

          if (
            error instanceof TypeError ||
            error.message ===
              "Failed to fetch"
          ) {

            showError(
              "❌ تعذر الاتصال بـ Render. تأكد من CORS وأن السيرفر يعمل."
            );

          } else {

            showError(
              "❌ " +
              (
                error.message ||
                "فشل تسجيل الدخول."
              )
            );

          }

        } finally {

          setLoading(false);

        }

      }
    );

  </script>

</body>

</html>
