<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>N10 SERVER MENA - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #123b70 0%,
          #071525 45%,
          #03070d 100%
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;

      background: rgba(8, 20, 36, 0.95);

      border: 1px solid #168cff;
      border-radius: 24px;

      padding: 30px 22px;

      box-shadow:
        0 0 35px rgba(0, 140, 255, 0.25);

      text-align: center;
    }

    .logo {
      width: 95px;
      height: 95px;

      margin: 0 auto 18px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          #168cff,
          #0051a8
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
      font-weight: bold;

      box-shadow:
        0 0 25px rgba(22, 140, 255, 0.45);
    }

    h1 {
      color: #42a5ff;

      font-size: 28px;

      margin-bottom: 8px;
    }

    .subtitle {
      color: #a9c9e8;

      font-size: 14px;

      margin-bottom: 25px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);

      border-radius: 16px;

      padding: 20px;

      text-align: right;
    }

    .card h2 {
      color: #42a5ff;

      text-align: center;

      margin-bottom: 8px;
    }

    .description {
      color: #c8d9e8;

      font-size: 14px;

      line-height: 1.7;

      text-align: center;

      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;

      color: #a9c9e8;

      font-size: 13px;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid #168cff;

      border-radius: 12px;

      background: #071525;

      color: white;

      outline: none;

      font-size: 15px;

      direction: ltr;

      text-align: left;
    }

    input:focus {
      border-color: #42a5ff;

      box-shadow:
        0 0 12px rgba(22, 140, 255, 0.3);
    }

    .btn {
      width: 100%;

      padding: 14px;

      margin-top: 8px;

      border: none;

      border-radius: 14px;

      background: #168cff;

      color: white;

      font-weight: bold;

      font-size: 16px;

      cursor: pointer;

      transition: 0.2s;
    }

    .btn:hover {
      background: #087de8;
    }

    .btn:disabled {
      opacity: 0.65;

      cursor: not-allowed;
    }

    #message {
      min-height: 22px;

      margin-top: 15px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .success {
      color: #5cff8a;
    }

    .error {
      color: #ff5555;
    }

    .links {
      text-align: center;

      margin-top: 20px;

      color: #a9c9e8;

      font-size: 13px;
    }

    .links a {
      color: #42a5ff;

      text-decoration: none;

      font-weight: bold;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .loading {
      opacity: 0.7;

      pointer-events: none;
    }
  </style>
</head>


<body>

  <div class="container">

    <div class="logo">
      N10
    </div>


    <h1>
      N10 SERVER MENA
    </h1>


    <p class="subtitle">
      تسجيل الدخول إلى حسابك
    </p>


    <div class="card">

      <h2>
        🔐 تسجيل الدخول
      </h2>


      <p class="description">
        أدخل اسم المستخدم وكلمة المرور للدخول إلى حسابك.
      </p>


      <form id="loginForm">

        <div class="form-group">

          <label for="username">
            اسم المستخدم
          </label>

          <input
            id="username"
            name="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
            minlength="3"
            maxlength="24"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            كلمة المرور
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            minlength="6"
            required
          >

        </div>


        <button
          id="loginButton"
          class="btn"
          type="submit"
        >
          LOGIN
        </button>


        <p id="message"></p>

      </form>


      <div class="links">

        ما عندكش حساب؟

        <a href="./index.html">
          إنشاء حساب
        </a>

      </div>

    </div>

  </div>


  <script>

    /*
      رابط السيرفر
    */

    const API_URL =
      "https://n10-discord-backend-new.onrender.com";


    /*
      عناصر الصفحة
    */

    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");

    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");


    /*
      تسجيل الدخول
    */

    form.addEventListener("submit", async (e) => {

      e.preventDefault();


      /*
        أخذ البيانات
      */

      const username =
        usernameInput.value.trim();

      const password =
        passwordInput.value;


      /*
        التحقق من البيانات
      */

      if (!username) {

        message.className = "error";

        message.textContent =
          "الرجاء إدخال اسم المستخدم.";

        usernameInput.focus();

        return;
      }


      if (!password) {

        message.className = "error";

        message.textContent =
          "الرجاء إدخال كلمة المرور.";

        passwordInput.focus();

        return;
      }


      /*
        حالة التحميل
      */

      message.className = "";

      message.textContent =
        "جاري تسجيل الدخول...";

      loginButton.disabled = true;

      loginButton.classList.add("loading");

      loginButton.textContent =
        "جاري الدخول...";


      try {

        /*
          إرسال طلب تسجيل الدخول
        */

        const response =
          await fetch(
            `${API_URL}/api/login`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              body: JSON.stringify({
                username: username,
                password: password
              })
            }
          );


        /*
          قراءة رد السيرفر
          بطريقة آمنة
        */

        let data = {};

        const contentType =
          response.headers.get(
            "content-type"
          ) || "";


        if (
          contentType.includes(
            "application/json"
          )
        ) {

          try {

            data =
              await response.json();

          } catch {

            data = {};

          }

        }


        /*
          تسجيل الدخول فشل
        */

        if (!response.ok) {

          message.className = "error";

          message.textContent =
            data.message ||
            "اسم المستخدم أو كلمة المرور غير صحيحة.";

          return;
        }


        /*
          حفظ معلومات المستخدم
          إذا أرسلها السيرفر
        */

        if (data.user) {

          localStorage.setItem(
            "n10User",
            JSON.stringify(data.user)
          );

        }


        /*
          البحث عن Access Key
        */

        const accessKey =
          data.accessKey ||
          data.access_key ||
          (
            data.user &&
            (
              data.user.accessKey ||
              data.user.access_key
            )
          ) ||
          null;


        /*
          نجاح تسجيل الدخول
        */

        message.className =
          "success";

        message.textContent =
          "✅ تم تسجيل الدخول بنجاح!";


        /*
          إذا وجدنا Access Key
        */

        if (accessKey) {

          /*
            حفظ المفتاح محلياً
          */

          localStorage.setItem(
            "n10AccessKey",
            accessKey
          );


          /*
            تحويل المستخدم
            إلى الصفحة الرئيسية
          */

          setTimeout(() => {

            window.location.href =
              "./index.html";

          }, 800);

          return;
        }


        /*
          إذا لم يوجد Access Key
        */

        if (
          data.user &&
          data.user.username
        ) {

          setTimeout(() => {

            message.textContent =
              `✅ مرحباً ${data.user.username}`;

          }, 800);

        }


      } catch (error) {

        /*
          خطأ في الاتصال بالسيرفر
        */

        console.error(
          "N10 Login Error:",
          error
        );


        message.className =
          "error";

        message.textContent =
          "❌ تعذر الاتصال بسيرفر N10. حاول مرة أخرى.";

      } finally {

        /*
          إعادة الزر لحالته الطبيعية
        */

        loginButton.disabled = false;

        loginButton.classList.remove(
          "loading"
        );

        loginButton.textContent =
          "LOGIN";

      }

    });

  </script>

</body>

</html>
