<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N10 SERVER MENA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #123b70 0%, #071525 45%, #03070d 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(8, 20, 36, 0.94);
      border: 1px solid #168cff;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 0 35px rgba(0, 140, 255, 0.25);
      text-align: center;
    }

    .logo {
      width: 95px;
      height: 95px;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, #168cff, #0051a8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(22, 140, 255, 0.45);
    }

    h1 {
      color: #42a5ff;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a9c9e8;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card h2 {
      color: #42a5ff;
      margin-bottom: 10px;
    }

    .card p {
      color: #c8d9e8;
      font-size: 14px;
      line-height: 1.7;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 14px;
      background: #168cff;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">N10</div>

    <h1>N10 SERVER MENA</h1>

    <p class="subtitle">
      مرحباً بكم في N10 SERVER MENA
    </p>

    <div class="card">
      <h2>أهلاً وسهلاً 👋</h2>
      <p>
        هذا هو الموقع الرسمي لـ N10 SERVER MENA.
      </p>
    </div>

    <div class="card">
      <h2>السيرفر</h2>
      <p>
        جميع المعلومات والخدمات الخاصة بالسيرفر تجدها هنا.
      </p>

      <a class="btn" href="#">
        دخول السيرفر
      </a>
    </div>

  </div>

</body>
</html>
