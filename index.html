<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>N10 Server - Sign In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top, #172b55 0%, #0b1224 45%, #05070d 100%);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
    }

    .container {
      width: 90%;
      max-width: 420px;

      background: rgba(18, 24, 40, 0.95);

      border: 1px solid rgba(0, 123, 255, 0.35);

      border-radius: 20px;

      padding: 35px 25px;

      text-align: center;

      box-shadow:
        0 0 30px rgba(0, 123, 255, 0.25),
        0 0 70px rgba(0, 123, 255, 0.08);

      backdrop-filter: blur(10px);
    }

    .logo {
      width: 110px;
      height: 110px;

      margin: auto;

      border-radius: 25px;

      background: #070b14;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 70px;
      font-weight: bold;

      color: #1683ff;

      border: 1px solid rgba(22, 131, 255, 0.35);

      box-shadow:
        0 0 25px rgba(22, 131, 255, 0.35),
        inset 0 0 20px rgba(22, 131, 255, 0.08);
    }

    h1 {
      color: #1683ff;

      margin: 20px 0 10px;

      font-size: 30px;

      text-shadow:
        0 0 15px rgba(22, 131, 255, 0.45);
    }

    p {
      color: #c4c9d4;

      margin-bottom: 30px;

      font-size: 16px;
    }

    .discord-btn {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #5865F2;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

      box-shadow:
        0 0 20px rgba(88, 101, 242, 0.25);
    }

    .discord-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 30px rgba(88, 101, 242, 0.45);
    }

    .discord-btn:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 25px;

      color: #6f7785;

      font-size: 12px;
    }

    .status {
      margin-top: 15px;

      font-size: 12px;

      color: #4da3ff;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      N
    </div>

    <h1>
      N10 SERVER
    </h1>

    <p>
      Sign in using your Discord account
    </p>

    <button
      class="discord-btn"
      onclick="loginDiscord()"
    >
      SIGN IN WITH DISCORD
    </button>

    <div class="status">
      ● N10 Server Online
    </div>

    <div class="footer">
      N10 Community Server
    </div>

  </div>

  <script>
    function loginDiscord() {
      // Send the user to the backend
      window.location.href =
        "https://n10-discord-backend-new.onrender.com/auth/discord";
    }
  </script>

</body>
</html>
